[project]
name = "ai-log-analyzer"
version = "0.1.0"
description = "Fully local, offline, AI-powered security log analyzer built on Ollama."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Log Analyzer Contributors" }]
keywords = ["security", "log-analysis", "ollama", "llm", "siem", "offline-ai", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "diskcache>=5.6,<6.0",
    "chromadb>=0.5,<1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/your-username/ai-log-analyzer"
Changelog = "https://github.com/your-username/ai-log-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
ai-log-analyzer = "main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "S",             # flake8-bandit (security)
    "SIM",           # flake8-simplify
    "ASYNC",         # flake8-async
    "RUF",           # ruff-specific rules
]
ignore = [
    "S101",  # assert is fine (used defensively and in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
# Embedded CSS/HTML template content doesn't follow Python's line-length
# conventions, and manually wrapping CSS declarations mid-property hurts
# their own readability for no benefit here.
"src/reporting/html_report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
exclude = ["build/", "dist/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "diskcache.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pytest / coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a running Ollama server",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
